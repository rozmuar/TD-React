server {
    listen 80;
    listen 443 ssl http2;
    server_name topdisc.ru www.topdisc.ru 31.129.101.230;

    # SSL сертификат этого сервера (фронтенд, topdisc.ru) — выпускается
    # через certbot прямо на этой машине, см. команду в истории проекта
    ssl_certificate /etc/letsencrypt/live/topdisc.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/topdisc.ru/privkey.pem;

    root /var/www/topdisk/dist/client;
    index index.html;

    # Логи
    access_log /var/log/nginx/topdisk_access.log;
    error_log /var/log/nginx/topdisk_error.log;

    # Gzip сжатие
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript;
    gzip_min_length 1000;

    # Проксирование API запросов к back.topdisc.ru (весь Bitrix-бэкенд
    # переехал с topdisc.ru на back.topdisc.ru, 2026-09-22). Держим запросы
    # браузера на том же домене topdisc.ru намеренно, не только для cookies —
    # сертификат back.topdisc.ru пока не покрывает сам этот хост (SAN:
    # topdisc.ru, www.topdisc.ru), прямой кросс-доменный запрос из браузера
    # к back.topdisc.ru упадёт с ошибкой сертификата. nginx-proxy_pass эту
    # проверку не делает (proxy_ssl_verify по умолчанию off), поэтому здесь
    # проблемы нет — но её нужно снять переизданием сертификата, см. память
    # проекта (checkout_payment_redirect_fix.md и заметки о миграции API).
    location /api/mobile/ {
        proxy_pass https://back.topdisc.ru/mobile/;
        proxy_set_header Host back.topdisc.ru;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Важно для сохранения cookies и сессий
        proxy_cookie_domain back.topdisc.ru $host;
        proxy_cookie_path / /;

        # Таймауты
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;

        # Отключаем буферизацию для streaming
        proxy_buffering off;
    }

    # Проксирование старого Bitrix REST API (app_mobile.*.json — каталог,
    # баннеры, "для вас", бренды, новости и т.д.) — раньше bitrixClient ходил
    # напрямую по абсолютному URL (тоже topdisc.ru, тот же домен, прокси не
    # требовался); теперь бэкенд на другом домене, и без этого прокси все эти
    # запросы упирались бы в ту же проблему сертификата, что и /api/mobile/.
    location /api/rest/ {
        proxy_pass https://back.topdisc.ru/rest/;
        proxy_set_header Host back.topdisc.ru;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;

        proxy_buffering off;
    }

    # Проксирование статического контента Bitrix (картинки товаров/баннеров/
    # новостей из iblock и medialibrary, картинки инфостраниц, тема сайта) —
    # весь этот контент теперь физически лежит на back.topdisc.ru, а не
    # локально в dist/client. ^~ обязателен: без него ниже стоящий regex-
    # location по расширению файла (.jpg/.png/...) перехватил бы эти пути
    # раньше и отдавал 404 из локальной файловой системы, так и не дойдя
    # до proxy_pass (regex-location в nginx приоритетнее обычного prefix,
    # если только у prefix нет ^~).
    location ^~ /upload/ {
        proxy_pass https://back.topdisc.ru/upload/;
        proxy_set_header Host back.topdisc.ru;
        proxy_connect_timeout 60s;
        proxy_read_timeout 60s;
        expires 30d;
        add_header Cache-Control "public";
    }

    location ^~ /local/ {
        proxy_pass https://back.topdisc.ru/local/;
        proxy_set_header Host back.topdisc.ru;
        proxy_connect_timeout 60s;
        proxy_read_timeout 60s;
        expires 30d;
        add_header Cache-Control "public";
    }

    location ^~ /bonus/ {
        proxy_pass https://back.topdisc.ru/bonus/;
        proxy_set_header Host back.topdisc.ru;
        expires 30d;
        add_header Cache-Control "public";
    }

    location ^~ /o-nas/ {
        proxy_pass https://back.topdisc.ru/o-nas/;
        proxy_set_header Host back.topdisc.ru;
        expires 30d;
        add_header Cache-Control "public";
    }

    location ^~ /personal-service/ {
        proxy_pass https://back.topdisc.ru/personal-service/;
        proxy_set_header Host back.topdisc.ru;
        expires 30d;
        add_header Cache-Control "public";
    }

    # Статические файлы
    location ~* \.(js|css|png|jpg|jpeg|gif|svg|ico|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA routing - все остальные запросы идут на index.html
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, must-revalidate";
    }
}
