# Пул постоянных соединений к back.topdisc.ru — без него каждый
# проксируемый запрос (а это ВСЕ картинки на странице плюс оба API)
# заново поднимал TCP+TLS до бэкенда с нуля. До переезда бэкенда на
# отдельный домен такого прокси-хопа не было вообще (один и тот же
# сервер), поэтому просадка стала заметна именно после миграции — не
# сам факт проксирования тормозит, а отсутствие переиспользования
# соединений. keepalive работает только внутри upstream-блока, простого
# proxy_pass на голый хост для этого недостаточно.
upstream back_topdisc {
    server back.topdisc.ru:443;
    keepalive 64;
}

# Node SSR-процесс (server.js, npm start / NODE_ENV=production node server.js,
# слушает PORT из env, по умолчанию 3000). До этого location / отдавал
# статический dist/client/index.html напрямую через try_files — SSR-бандл
# (dist/server/entry-server.js) вообще ни разу не вызывался в проде: сайт
# фактически работал как чистый CSR/SPA (пустой шелл + гидратация на
# клиенте) — отсюда и "SSR не генерируется", и более ранние ошибки
# гидратации React (#418/#423) в консоли — React сверял серверный HTML
# с тем, что сам же нарисовал на клиенте, а не с настоящим SSR.
upstream ssr_node {
    server 127.0.0.1:3000;
    keepalive 32;
}

server {
    listen 80;
    listen 443 ssl http2;
    server_name topdisc.ru www.topdisc.ru 31.129.101.230;

    # SSL сертификат этого сервера (фронтенд, topdisc.ru) — выпускается
    # через certbot прямо на этой машине, см. команду в истории проекта
    ssl_certificate /etc/letsencrypt/live/topdisc.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/topdisc.ru/privkey.pem;

    root /var/www/topdisk/dist/client;
    index index.html;

    # Логи
    access_log /var/log/nginx/topdisk_access.log;
    error_log /var/log/nginx/topdisk_error.log;

    # Gzip сжатие
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript;
    gzip_min_length 1000;

    # Проксирование API запросов к back.topdisc.ru (весь Bitrix-бэкенд
    # переехал с topdisc.ru на back.topdisc.ru, 2026-09-22). Держим запросы
    # браузера на том же домене topdisc.ru намеренно — без CORS и с общими
    # cookies. proxy_pass идёт на upstream back_topdisc (см. выше) —
    # proxy_http_version 1.1 + пустой Connection обязательны, иначе
    # keepalive в upstream-блоке не работает и переиспользования соединений
    # не будет, несмотря на upstream { keepalive ... }.
    location /api/mobile/ {
        proxy_pass https://back_topdisc/mobile/;
        proxy_ssl_server_name on;
        proxy_ssl_name back.topdisc.ru;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host back.topdisc.ru;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Важно для сохранения cookies и сессий
        proxy_cookie_domain back.topdisc.ru $host;
        proxy_cookie_path / /;

        # Таймауты
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;

        # Отключаем буферизацию для streaming
        proxy_buffering off;
    }

    # Проксирование старого Bitrix REST API (app_mobile.*.json — каталог,
    # баннеры, "для вас", бренды, новости и т.д.) — раньше bitrixClient ходил
    # напрямую по абсолютному URL (тоже topdisc.ru, тот же домен, прокси не
    # требовался); теперь бэкенд на другом домене.
    location /api/rest/ {
        proxy_pass https://back_topdisc/rest/;
        proxy_ssl_server_name on;
        proxy_ssl_name back.topdisc.ru;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host back.topdisc.ru;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;

        proxy_buffering off;
    }

    # Статику Bitrix (картинки товаров/баннеров/новостей, картинки
    # инфостраниц, тема сайта — /upload/, /local/, /bonus/, /o-nas/,
    # /personal-service/) раньше проксировали через этот же nginx: у
    # back.topdisc.ru не было сертификата на сам этот хост, а для <img src>
    # напрямую с чужого домена это было не обойти. Сертификат почижен
    # (2026-09-22) — прокси для статики больше не нужен и только добавлял
    # лишний хоп на каждую картинку (для <img src> CORS не требуется вообще,
    # в отличие от API-запросов). Фронтенд теперь ссылается на
    # https://back.topdisc.ru/... напрямую (см. apiClient.js/stripStaleHost
    # и картиночные константы по всему src/).

    # Статические файлы
    location ~* \.(js|css|png|jpg|jpeg|gif|svg|ico|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Все остальные запросы — реальный SSR через Node (см. upstream ssr_node
    # выше), не статический index.html. Node сам решает, что отдать:
    # серверно отрисованную страницу (render() из entry-server.js) или
    # голый шелл для страниц, требующих авторизации (CLIENT_ONLY_RE
    # в server.js — /cart/, /personal/, /compare/, /favorites/).
    location / {
        proxy_pass http://ssr_node;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 30s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;

        add_header Cache-Control "no-cache, must-revalidate";
    }
}
