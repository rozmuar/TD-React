server {
    listen 80;
    listen 443 ssl http2;
    server_name 31.129.101.230;

    # SSL сертификаты (если есть)
    # ssl_certificate /path/to/cert.pem;
    # ssl_certificate_key /path/to/key.pem;

    root /var/www/topdisk/dist;
    index index.html;

    # Логи
    access_log /var/log/nginx/topdisk_access.log;
    error_log /var/log/nginx/topdisk_error.log;

    # Gzip сжатие
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript;
    gzip_min_length 1000;

    # Проксирование API запросов к topdisc.ru
    location /api/mobile/ {
        proxy_pass https://topdisc.ru/mobile/;
        proxy_set_header Host topdisc.ru;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Важно для сохранения cookies и сессий
        proxy_cookie_domain topdisc.ru $host;
        proxy_cookie_path / /;
        
        # Таймауты
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        
        # Отключаем буферизацию для streaming
        proxy_buffering off;
    }

    # Статические файлы
    location ~* \.(js|css|png|jpg|jpeg|gif|svg|ico|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA routing - все остальные запросы идут на index.html
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, must-revalidate";
    }
}
