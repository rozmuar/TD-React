# Фронтенд topdisc.ru против бэка на отдельном VPS по IP (2026-11-11).
# Замена nginx-newback.conf (там бэк — хостинг Timeweb back.topdisc.ru).
# Ставится ВМЕСТО него: /etc/nginx/sites-available/topdisk-new.
#
# Бэк настроен под будущее имя back.topdisc.ru (deploy/back.topdisc.ru/), но
# DNS пока не указывает на него, поэтому:
#   - соединяемся по IP (upstream back_vps), а Host/SNI = back.topdisc.ru;
#   - у бэка самоподписанный сертификат — nginx апстрим не проверяет
#     (proxy_ssl_verify по умолчанию off), браузер его не видит вообще;
#   - браузер ходит к бэку ТОЛЬКО через этот nginx: API (/api/...), картинки
#     и файлы (/upload/, /local/), служебное Bitrix и админка (/bitrix/).
#     Поэтому фронт собирается с VITE_BACKEND_ORIGIN=https://topdisc.ru.
#   - Node (SSR, уведомления Т-Банка) ходит через внутренний 127.0.0.1:8081:
#     VITE_BITRIX_REST_URL=http://127.0.0.1:8081/rest/3/ky7kc0zinte6jb7e
#     VITE_FILTER_API_URL=http://127.0.0.1:8081/mobile/v1
#     BITRIX_SERVER_ORIGIN=http://127.0.0.1:8081
#
# BACK_IP ниже — заменить на IP VPS бэка:
#   sed -i 's/BACK_IP/1.2.3.4/' /etc/nginx/sites-available/topdisk-new
#
# Когда back.topdisc.ru заработает по DNS с нормальным сертификатом, можно
# оставить как есть (всё через фронт) или отдавать картинки напрямую с бэка
# (убрать VITE_BACKEND_ORIGIN — дефолт и есть https://back.topdisc.ru).

proxy_cache_path /var/cache/nginx/td_api levels=1:2 keys_zone=td_api_cache:20m
                 max_size=1g inactive=24h use_temp_path=off;
limit_req_zone $binary_remote_addr zone=td_api_rl:10m rate=10r/s;
limit_req_status 429;

proxy_cache_path /var/cache/nginx/td_static levels=1:2 keys_zone=td_static_cache:20m
                 max_size=5g inactive=30d use_temp_path=off;

upstream back_vps {
    server BACK_IP:443;
    keepalive 32;
}

upstream ssr_node_new {
    server 127.0.0.1:3001;
    keepalive 16;
}

# Внутренний прокси к бэку для SSR (Node) — тот же кэш, наружу не слушает.
server {
    listen 127.0.0.1:8081;
    server_name _;
    access_log off;

    location /rest/ {
        proxy_pass https://back_vps/rest/;
        proxy_ssl_server_name on;
        proxy_ssl_name back.topdisc.ru;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host back.topdisc.ru;
        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;

        proxy_cache td_api_cache;
        proxy_cache_key "$request_method$request_uri";
        proxy_cache_methods GET HEAD;
        proxy_cache_valid 200 10m;
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
        proxy_cache_background_update on;
        proxy_cache_lock on;
        proxy_ignore_headers Cache-Control Expires Set-Cookie;
        proxy_hide_header Set-Cookie;
    }

    location ~ ^/mobile/v1/(filter/|sale/stores) {
        proxy_pass https://back_vps;
        proxy_ssl_server_name on;
        proxy_ssl_name back.topdisc.ru;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host back.topdisc.ru;
        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;

        proxy_cache td_api_cache;
        proxy_cache_key "$request_method$request_uri";
        proxy_cache_methods GET HEAD;
        proxy_cache_valid 200 10m;
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
        proxy_cache_background_update on;
        proxy_cache_lock on;
        proxy_ignore_headers Cache-Control Expires Set-Cookie;
        proxy_hide_header Set-Cookie;
    }

    location /mobile/ {
        proxy_pass https://back_vps/mobile/;
        proxy_ssl_server_name on;
        proxy_ssl_name back.topdisc.ru;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host back.topdisc.ru;
        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;
    }

    # Прочее для Node без кэша (ретрансляция уведомлений Т-Банка в
    # /personal/order/notification.php и т.п.).
    location / {
        proxy_pass https://back_vps;
        proxy_ssl_server_name on;
        proxy_ssl_name back.topdisc.ru;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host back.topdisc.ru;
        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;
    }
}

server {
    listen 80;
    listen 443 ssl http2;
    server_name topdisc.ru www.topdisc.ru;

    # certbot certonly --webroot -w /var/www/letsencrypt -d topdisc.ru -d www.topdisc.ru
    ssl_certificate /etc/letsencrypt/live/topdisc.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/topdisc.ru/privkey.pem;

    root /var/www/topdisk-new/dist/client;
    index index.html;

    access_log /var/log/nginx/topdisk_new_access.log;
    error_log /var/log/nginx/topdisk_new_error.log;

    # Проверка Let's Encrypt (certbot --webroot -w /var/www/letsencrypt).
    # Без этого блока путь без расширения уходил в Node SSR, тот отдавал
    # целую HTML-страницу, и LE падал с "reader size limit exceeded".
    # Отдельная папка, не dist/client — её стирает каждая пересборка.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
        try_files $uri =404;
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript;
    gzip_min_length 1000;

    # Публичный старый REST (app_mobile.* — каталог, меню, баннеры, новости,
    # страницы): одинаков для всех, кэшируем. Персональных данных тут нет —
    # корзина/авторизация/заказы идут через /api/mobile/.
    location /api/rest/ {
        limit_req zone=td_api_rl burst=40 nodelay;

        proxy_pass https://back_vps/rest/;
        proxy_ssl_server_name on;
        proxy_ssl_name back.topdisc.ru;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host back.topdisc.ru;
        proxy_connect_timeout 10s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;

        proxy_cache td_api_cache;
        proxy_cache_key "$request_method$request_uri";
        proxy_cache_methods GET HEAD;
        proxy_cache_valid 200 10m;
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
        proxy_cache_background_update on;
        proxy_cache_lock on;
        proxy_ignore_headers Cache-Control Expires Set-Cookie;
        proxy_hide_header Set-Cookie;
        add_header X-Cache $upstream_cache_status always;
    }

    # mobile/v1: публичные фильтры каталога и список складов — кэшируем.
    location ~ ^/api/mobile/v1/(filter/|sale/stores) {
        limit_req zone=td_api_rl burst=40 nodelay;

        rewrite ^/api(/mobile/.*)$ $1 break;
        proxy_pass https://back_vps;
        proxy_ssl_server_name on;
        proxy_ssl_name back.topdisc.ru;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host back.topdisc.ru;
        proxy_connect_timeout 10s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;

        proxy_cache td_api_cache;
        proxy_cache_key "$request_method$request_uri";
        proxy_cache_methods GET HEAD;
        proxy_cache_valid 200 10m;
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
        proxy_cache_background_update on;
        proxy_cache_lock on;
        proxy_ignore_headers Cache-Control Expires Set-Cookie;
        proxy_hide_header Set-Cookie;
        add_header X-Cache $upstream_cache_status always;
    }

    # Остальной mobile/v1 — корзина, авторизация, чекаут, профиль: персональное,
    # НЕ кэшируется.
    location /api/mobile/ {
        limit_req zone=td_api_rl burst=40 nodelay;

        proxy_pass https://back_vps/mobile/;
        proxy_ssl_server_name on;
        proxy_ssl_name back.topdisc.ru;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host back.topdisc.ru;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cookie_domain back.topdisc.ru $host;
        proxy_cookie_path / /;
        proxy_connect_timeout 10s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        proxy_buffering off;
    }

    # Файлы Bitrix (картинки товаров, баннеров, новостей) — через фронт,
    # с долгим кэшем: бэк по IP с самоподписанным сертификатом браузеру
    # напрямую недоступен. ^~ — чтобы не перехватил regex статики ниже.
    location ^~ /upload/ {
        proxy_pass https://back_vps;
        proxy_ssl_server_name on;
        proxy_ssl_name back.topdisc.ru;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host back.topdisc.ru;
        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;

        proxy_cache td_static_cache;
        proxy_cache_key "$uri";
        proxy_cache_valid 200 30d;
        proxy_cache_valid 404 1m;
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
        proxy_cache_lock on;
        proxy_ignore_headers Cache-Control Expires Set-Cookie;
        proxy_hide_header Set-Cookie;
        expires 30d;
        add_header X-Cache $upstream_cache_status always;
    }

    location ^~ /local/ {
        proxy_pass https://back_vps;
        proxy_ssl_server_name on;
        proxy_ssl_name back.topdisc.ru;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host back.topdisc.ru;
        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;

        proxy_cache td_static_cache;
        proxy_cache_key "$uri";
        proxy_cache_valid 200 1d;
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
        proxy_ignore_headers Cache-Control Expires Set-Cookie;
        proxy_hide_header Set-Cookie;
    }

    # Служебное Bitrix: админка (https://topdisc.ru/bitrix/admin/ — с
    # нормальным сертификатом, в отличие от входа по IP), обработчики
    # платёжек /bitrix/tools/, js/css ядра. Без кэша.
    location ^~ /bitrix/ {
        proxy_pass https://back_vps;
        proxy_ssl_server_name on;
        proxy_ssl_name back.topdisc.ru;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host back.topdisc.ru;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cookie_domain back.topdisc.ru $host;
        proxy_connect_timeout 10s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
        client_max_body_size 1024m;
        proxy_request_buffering off;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|svg|ico|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location / {
        proxy_pass http://ssr_node_new;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 30s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
        add_header Cache-Control "no-cache, must-revalidate";
    }
}
