# back.topdisc.ru — Bitrix-бэкенд TopDisk на отдельном VPS (Ubuntu 26.04), 2026-11-11.
#
# Всё названо под домен back.topdisc.ru: папка сайта, сокет php-fpm, логи,
# сертификат. Пока DNS на этот VPS не указывает, сервер работает по IP:
#   - этот server — default_server, поэтому отвечает и на https://<IP>/;
#   - сертификат самоподписанный (/etc/ssl/back.topdisc.ru/), CN и SAN —
#     back.topdisc.ru + IP сервера. nginx фронта сертификат апстрима по
#     умолчанию не проверяет, браузер при заходе по IP покажет предупреждение.
#   - фронт (topdisc.ru, 201.24.52.252) ходит сюда по IP с заголовком
#     Host: back.topdisc.ru — Bitrix уже сейчас "видит" своё будущее имя.
#
# Когда back.topdisc.ru начнёт указывать на этот VPS:
#   certbot certonly --webroot -w /var/www/letsencrypt -d back.topdisc.ru
#   и заменить две строки ssl_certificate* ниже на
#   /etc/letsencrypt/live/back.topdisc.ru/{fullchain,privkey}.pem.
#
# Ставится как /etc/nginx/sites-available/back.topdisc.ru (+ симлинк в
# sites-enabled) скриптом setup.sh из этой же папки.

upstream php_back_topdisc {
    server unix:/run/php/back.topdisc.ru.sock;
}

server {
    listen 80 default_server;
    listen 443 ssl default_server;
    http2 on;
    server_name back.topdisc.ru _;

    ssl_certificate     /etc/ssl/back.topdisc.ru/fullchain.pem;
    ssl_certificate_key /etc/ssl/back.topdisc.ru/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    root /var/www/back.topdisc.ru;
    index index.php index.html;
    charset utf-8;
    client_max_body_size 1024m;

    access_log /var/log/nginx/back.topdisc.ru.access.log;
    error_log  /var/log/nginx/back.topdisc.ru.error.log;

    # Реальный IP посетителя из заголовка, который ставит nginx фронта.
    set_real_ip_from 201.24.52.252;
    real_ip_header X-Forwarded-For;

    # Let's Encrypt — на будущее, когда появится DNS back.topdisc.ru.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
        try_files $uri =404;
    }

    # Служебное Bitrix и скрытые файлы — наружу не отдаём.
    location ~ /\.(?!well-known/) { deny all; }
    location ~* ^/bitrix/(modules|local_cache|stack_cache|managed_cache|php_interface|backup)/ { deny all; }
    location ~* ^/bitrix/\.settings(_extra)?\.php$ { deny all; }
    location ~* ^/local/php_interface/ { deny all; }
    # В /upload/ никакой исполняемый код не запускается.
    location ~* ^/upload/.*\.(php\d?|phtml|phar|pl|py|cgi|sh)$ { deny all; }

    location / {
        try_files $uri $uri/ @bitrix;
    }

    location ~ \.php$ {
        try_files $uri @bitrix;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_pass php_back_topdisc;
        fastcgi_read_timeout 300s;
        fastcgi_buffer_size 32k;
        fastcgi_buffers 16 32k;
    }

    # ЧПУ Bitrix: всё, чего нет на диске (/rest/..., /mobile/..., разделы
    # сайта), обрабатывает /bitrix/urlrewrite.php.
    location @bitrix {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root/bitrix/urlrewrite.php;
        fastcgi_param SCRIPT_NAME /bitrix/urlrewrite.php;
        fastcgi_pass php_back_topdisc;
        fastcgi_read_timeout 300s;
        fastcgi_buffer_size 32k;
        fastcgi_buffers 16 32k;
    }

    location ~* \.(jpe?g|png|gif|webp|avif|svg|ico|css|js|woff2?|ttf|eot|pdf|mp4)$ {
        expires 30d;
        access_log off;
        try_files $uri =404;
    }
}
