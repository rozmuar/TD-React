# Фронтенд topdisc.ru против нового бэка cw325546.tw1.ru — временный сервер
# на период сбоя back.topdisc.ru (2026-11-10). Отдельная чистая машина:
#   код        /var/www/topdisk-new   (сборка: npm run build:newback)
#   Node SSR   127.0.0.1:3001         (systemd: topdisk-new.service)
#   домен      topdisc.ru, www.topdisc.ru (DNS A → IP этого сервера)
# Ставится в /etc/nginx/sites-available/topdisk-new + симлинк в sites-enabled.
#
# Бэк — виртуальный хостинг Timeweb. 2026-11-10 он забанил IP этого сервера:
# весь трафик сайта (включая ботов — Baidu и т.п.) шёл к нему с одного адреса,
# без кэша. Поэтому:
#   - публичные ответы API кэшируются здесь (td_api_cache) и при недоступности
#     бэка отдаются из кэша (proxy_cache_use_stale);
#   - частота запросов к /api/ с одного IP ограничена (limit_req);
#   - SSR (Node) ходит в бэк не напрямую, а через внутренний прокси
#     127.0.0.1:8081 с тем же кэшем (VITE_BITRIX_REST_URL / VITE_FILTER_API_URL);
#   - к бэку только по IPv4 (у этого сервера нет IPv6 — каждый запрос сначала
#     падал на "No route to host").

proxy_cache_path /var/cache/nginx/td_api levels=1:2 keys_zone=td_api_cache:20m
                 max_size=1g inactive=24h use_temp_path=off;
limit_req_zone $binary_remote_addr zone=td_api_rl:10m rate=10r/s;
limit_req_status 429;

upstream back_new {
    # IPv4-адрес cw325546.tw1.ru (dig +short -4 cw325546.tw1.ru). Если хостинг
    # сменит IP — обновить здесь.
    server 92.53.96.214:443;
    keepalive 32;
}

upstream ssr_node_new {
    server 127.0.0.1:3001;
    keepalive 16;
}

# Внутренний прокси к бэку для SSR (Node) — тот же кэш, наружу не слушает.
server {
    listen 127.0.0.1:8081;
    server_name _;
    access_log off;

    location /rest/ {
        proxy_pass https://back_new/rest/;
        proxy_ssl_server_name on;
        proxy_ssl_name cw325546.tw1.ru;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host cw325546.tw1.ru;
        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;

        proxy_cache td_api_cache;
        proxy_cache_key "$request_method$request_uri";
        proxy_cache_methods GET HEAD;
        proxy_cache_valid 200 10m;
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
        proxy_cache_background_update on;
        proxy_cache_lock on;
        proxy_ignore_headers Cache-Control Expires Set-Cookie;
        proxy_hide_header Set-Cookie;
    }

    location ~ ^/mobile/v1/(filter/|sale/stores) {
        proxy_pass https://back_new;
        proxy_ssl_server_name on;
        proxy_ssl_name cw325546.tw1.ru;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host cw325546.tw1.ru;
        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;

        proxy_cache td_api_cache;
        proxy_cache_key "$request_method$request_uri";
        proxy_cache_methods GET HEAD;
        proxy_cache_valid 200 10m;
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
        proxy_cache_background_update on;
        proxy_cache_lock on;
        proxy_ignore_headers Cache-Control Expires Set-Cookie;
        proxy_hide_header Set-Cookie;
    }

    location /mobile/ {
        proxy_pass https://back_new/mobile/;
        proxy_ssl_server_name on;
        proxy_ssl_name cw325546.tw1.ru;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host cw325546.tw1.ru;
        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;
    }
}

server {
    listen 80;
    listen 443 ssl http2;
    server_name topdisc.ru www.topdisc.ru;

    # certbot certonly --webroot -w /var/www/letsencrypt -d topdisc.ru -d www.topdisc.ru
    ssl_certificate /etc/letsencrypt/live/topdisc.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/topdisc.ru/privkey.pem;

    root /var/www/topdisk-new/dist/client;
    index index.html;

    access_log /var/log/nginx/topdisk_new_access.log;
    error_log /var/log/nginx/topdisk_new_error.log;

    # Проверка Let's Encrypt (certbot --webroot -w /var/www/letsencrypt).
    # Без этого блока путь без расширения уходил в Node SSR, тот отдавал
    # целую HTML-страницу, и LE падал с "reader size limit exceeded".
    # Отдельная папка, не dist/client — её стирает каждая пересборка.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
        try_files $uri =404;
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript;
    gzip_min_length 1000;

    # Публичный старый REST (app_mobile.* — каталог, меню, баннеры, новости,
    # страницы): одинаков для всех, кэшируем. Персональных данных тут нет —
    # корзина/авторизация/заказы идут через /api/mobile/.
    location /api/rest/ {
        limit_req zone=td_api_rl burst=40 nodelay;

        proxy_pass https://back_new/rest/;
        proxy_ssl_server_name on;
        proxy_ssl_name cw325546.tw1.ru;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host cw325546.tw1.ru;
        proxy_connect_timeout 10s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;

        proxy_cache td_api_cache;
        proxy_cache_key "$request_method$request_uri";
        proxy_cache_methods GET HEAD;
        proxy_cache_valid 200 10m;
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
        proxy_cache_background_update on;
        proxy_cache_lock on;
        proxy_ignore_headers Cache-Control Expires Set-Cookie;
        proxy_hide_header Set-Cookie;
        add_header X-Cache $upstream_cache_status always;
    }

    # mobile/v1: публичные фильтры каталога и список складов — кэшируем.
    location ~ ^/api/mobile/v1/(filter/|sale/stores) {
        limit_req zone=td_api_rl burst=40 nodelay;

        rewrite ^/api(/mobile/.*)$ $1 break;
        proxy_pass https://back_new;
        proxy_ssl_server_name on;
        proxy_ssl_name cw325546.tw1.ru;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host cw325546.tw1.ru;
        proxy_connect_timeout 10s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;

        proxy_cache td_api_cache;
        proxy_cache_key "$request_method$request_uri";
        proxy_cache_methods GET HEAD;
        proxy_cache_valid 200 10m;
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
        proxy_cache_background_update on;
        proxy_cache_lock on;
        proxy_ignore_headers Cache-Control Expires Set-Cookie;
        proxy_hide_header Set-Cookie;
        add_header X-Cache $upstream_cache_status always;
    }

    # Остальной mobile/v1 — корзина, авторизация, чекаут, профиль: персональное,
    # НЕ кэшируется.
    location /api/mobile/ {
        limit_req zone=td_api_rl burst=40 nodelay;

        proxy_pass https://back_new/mobile/;
        proxy_ssl_server_name on;
        proxy_ssl_name cw325546.tw1.ru;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host cw325546.tw1.ru;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cookie_domain cw325546.tw1.ru $host;
        proxy_cookie_path / /;
        proxy_connect_timeout 10s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        proxy_buffering off;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|svg|ico|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location / {
        proxy_pass http://ssr_node_new;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 30s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
        add_header Cache-Control "no-cache, must-revalidate";
    }
}
