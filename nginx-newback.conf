# Фронтенд topdisc.ru против нового бэка cw325546.tw1.ru — временный сервер
# на период сбоя back.topdisc.ru (2026-11-10). Отдельная чистая машина:
#   код        /var/www/topdisk-new   (сборка: npm run build:newback)
#   Node SSR   127.0.0.1:3001         (systemd: topdisk-new.service)
#   домен      topdisc.ru, www.topdisc.ru (DNS A → IP этого сервера)
# Ставится в /etc/nginx/sites-available/topdisk-new + симлинк в sites-enabled.

upstream back_new {
    server cw325546.tw1.ru:443;
    keepalive 32;
}

upstream ssr_node_new {
    server 127.0.0.1:3001;
    keepalive 16;
}

server {
    listen 80;
    listen 443 ssl http2;
    server_name topdisc.ru www.topdisc.ru;

    # certbot certonly --standalone -d topdisc.ru -d www.topdisc.ru
    ssl_certificate /etc/letsencrypt/live/topdisc.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/topdisc.ru/privkey.pem;

    root /var/www/topdisk-new/dist/client;
    index index.html;

    access_log /var/log/nginx/topdisk_new_access.log;
    error_log /var/log/nginx/topdisk_new_error.log;

    # Проверка Let's Encrypt (certbot --webroot -w /var/www/letsencrypt).
    # Без этого блока путь без расширения уходил в Node SSR, тот отдавал
    # целую HTML-страницу, и LE падал с "reader size limit exceeded".
    # Отдельная папка, не dist/client — её стирает каждая пересборка.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
        try_files $uri =404;
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript;
    gzip_min_length 1000;

    location /api/mobile/ {
        proxy_pass https://back_new/mobile/;
        proxy_ssl_server_name on;
        proxy_ssl_name cw325546.tw1.ru;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host cw325546.tw1.ru;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cookie_domain cw325546.tw1.ru $host;
        proxy_cookie_path / /;
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        proxy_buffering off;
    }

    location /api/rest/ {
        proxy_pass https://back_new/rest/;
        proxy_ssl_server_name on;
        proxy_ssl_name cw325546.tw1.ru;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host cw325546.tw1.ru;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        proxy_buffering off;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|svg|ico|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location / {
        proxy_pass http://ssr_node_new;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 30s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
        add_header Cache-Control "no-cache, must-revalidate";
    }
}
